[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-cursor-studio"
version = "0.2.0"
description = "Preview Windows cursors and build installable Linux Xcursor themes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Memória", email = "carlos@memoria.pro"}]
dependencies = ["Pillow>=11,<13", "PySide6-Essentials>=6.8,<7"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: X11 Applications :: Qt", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
cursor-studio = "cursor_studio.app:main"
cursor-studio-cli = "cursor_studio.cli:main"

[project.urls]
Homepage = "https://github.com/carlosmemoria/cursor-studio"
Issues = "https://github.com/carlosmemoria/cursor-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cursor_studio = ["icon.svg"]
